name: github_artifact_demo

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - release-*

  workflow_dispatch:

  # schedule:
  #   - cron: '0 9 * * *'

env:
  NODE_VERSION: '24'

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Test Code
        run: npm run test


  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Get Code
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Task
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-file
          path: dist


  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Get Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-file

      - name: List Files
        run: ls -la

      - name: Deploy
        run: echo "deploying....!"